<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Интелигентна карта на София</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link
      href="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="map-stage" aria-label="Интерактивна карта на плановите единици на София">
        <div id="map"></div>
        <div class="map-topbar">
          <div>
            <h1>Интелигентна карта на София</h1>
            <p>Кликнете върху планова единица за наем и качество на въздуха.</p>
          </div>
        </div>
        <div class="legend" aria-label="Легенда на картата">
          <span id="legendLeft">—</span>
          <div class="legend-ramp"></div>
          <span id="legendRight">—</span>
        </div>
        <div id="loadingStatus" class="loading-status">Зареждане на данни от СофияПлан...</div>
        <section id="profilePanel" class="panel profile-floating hidden" aria-label="Профил на района"></section>
      </main>

      <aside class="inspector" aria-label="Странична лента">
        <section class="panel finder-panel">
          <div class="panel-header">
            <div>
              <span class="section-kicker">Търсачка</span>
              <h2>Намери район</h2>
            </div>
          </div>
          <div class="finder-body">
            <label class="metric-label" for="mapMetricSelect">Показател за картата</label>
            <select id="mapMetricSelect" class="metric-select metric-select--full">
              <option value="rentPrice">Наем</option>
              <option value="airQuality">Качество на въздуха</option>
              <option value="transitScore">Градски транспорт</option>
            </select>
            <input id="districtSearch" type="search" placeholder="Търси планова единица..." autocomplete="off" />
            <div id="topOpportunities" class="opportunity-list"></div>
          </div>
        </section>

        <section class="panel transit-panel">
          <div class="panel-header">
            <div>
              <span class="section-kicker">Транспорт</span>
              <h2>Спирки на градския транспорт</h2>
            </div>
          </div>
          <div class="transit-toggles">
            <label class="transit-toggle">
              <input id="toggleMetro" type="checkbox" checked />
              <span class="swatch swatch-metro"></span>
              <span>Метростанции</span>
              <small id="metroCount" class="muted-note"></small>
            </label>
            <label class="transit-toggle">
              <input id="toggleStops" type="checkbox" checked />
              <span class="swatch swatch-stops"></span>
              <span>Спирки (автобус/трамвай/тролей)</span>
              <small id="stopsCount" class="muted-note"></small>
            </label>
            <label class="transit-toggle">
              <input id="toggleListings" type="checkbox" checked />
              <span class="swatch swatch-listings"></span>
              <span>Обяви за наем (imot.bg)</span>
              <small id="listingsCount" class="muted-note"></small>
            </label>
          </div>
        </section>

        <section class="panel dataset-panel">
          <div class="panel-header">
            <div>
              <span class="section-kicker">Данни</span>
              <h2>Статус на наборите от данни</h2>
            </div>
          </div>
          <div id="datasetStatus" class="dataset-status"></div>
        </section>
      </aside>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
